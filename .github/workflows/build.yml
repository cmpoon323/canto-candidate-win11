name: Build Windows Portable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            zip

      - name: Build self-contained Windows executable
        run: |
          mkdir -p dist package/CantoCandidate-Win11-Portable
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -mwindows -municode \
            -static -static-libgcc -static-libstdc++ \
            -Wl,--dynamicbase,--nxcompat,--high-entropy-va \
            src/CantoCandidate.cpp -o dist/CantoCandidate.exe \
            -lwinhttp -luser32 -lgdi32 -lshell32 -lole32
          cp dist/CantoCandidate.exe README.md LICENSE CHANGELOG.md TESTING.md \
            SECURITY_AUDIT_REPORT.md SECURITY_AUDIT_SCOPE.md ADVANCED_FEATURES_SPEC.md \
            V0.6_SPEC.md V0.7_SPEC.md V0.8_SPEC.md WINDOWS11_TEST_CHECKLIST.md custom_dictionary.tsv snippets.tsv settings.ini package/CantoCandidate-Win11-Portable/
          cp -r src research package/CantoCandidate-Win11-Portable/
          cd package
          zip -qr CantoCandidate-Win11-Portable.zip CantoCandidate-Win11-Portable
          sha256sum CantoCandidate-Win11-Portable.zip CantoCandidate-Win11-Portable/CantoCandidate.exe > CHECKSUMS-SHA256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CantoCandidate-Win11-Portable
          path: |
            package/CantoCandidate-Win11-Portable.zip
            package/CHECKSUMS-SHA256.txt
          if-no-files-found: error
